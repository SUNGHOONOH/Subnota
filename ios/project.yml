name: Subnota
options:
  bundleIdPrefix: com.subnota
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  SubnotaKit:
    path: SubnotaKit
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.0.0

targets:
  Subnota:
    type: application
    platform: iOS
    sources:
      - path: Subnota
    dependencies:
      - package: SubnotaKit
        product: SubnotaKit
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.subnota.app
        INFOPLIST_FILE: Subnota/Info.plist
        CODE_SIGN_ENTITLEMENTS: Subnota/Subnota.entitlements
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
